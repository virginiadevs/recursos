<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Recursos | Herramientas y recursos digitales</title>
    <meta name="author" content="VirginiaDevs">
    <meta name="description" content="Directorio de recursos digitales con enlaces a herramientas, plataformas y contenidos de utilidad.">

    <!-- Favicon -->
    <link rel="icon" href="img/favicon.png" type="image/png">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Mis estilos -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <theme-toggle></theme-toggle>

    <!-- HEADER -->
    <header>
        <div class="header-content">
            <figure class="site-logo">
                <img src="img/logo.webp" alt="Logo de la web, la cara de un búho con una lupa">
            </figure>

            <h1>Buscador de Recursos</h1>
            
            <h2>Directorio de recursos digitales con enlaces a herramientas, plataformas y contenidos de utilidad, organizados en un mismo espacio para facilitar su búsqueda y acceso.</h2>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="filter-section">
            <div class="search-group">
                <i class="fas fa-magnifying-glass"></i>
                <input type="search" name="search-input" id="search-input" placeholder="Buscar...">
            </div>

            <div class="tags-group"></div>
        </section>

        <section class="resources-section">
            <ul class="resources-list"></ul>

            <div class="pagination"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <brand-footer></brand-footer>

    <!-- Funciones -->
    <script src="js/theme-component.js"></script>
    <script src="js/footer-component.js"></script>
    <script src="js/functions.js"></script>
</body>
</html>
